<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Fantômes</title>
<meta name="robots" content="noindex">
<style>
:root{--fond:#F4F1EA;--encre:#16130F;--accent:#D9480F}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font:18px/1.5 system-ui,sans-serif}
main{max-width:34rem;margin:0 auto;padding:4rem 1.25rem}
h1{font:700 2.2rem/1.1 Georgia,serif;margin:0 0 1rem}
h1 em{color:var(--accent);font-style:normal}
.bouton{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:1.1rem;border-radius:.5rem;min-height:3.25rem;margin-top:2rem}
</style>
</head>
<body>
<main>
<h1>Cette page est <em>introuvable.</em></h1>
<p>Le lien est peut-être erroné, ou la page n'existe plus. Rien de grave : ton audit t'attend sur l'accueil.</p>
<a class="bouton" href="/">Revenir à l'accueil</a>
</main>
</body>
</html>
